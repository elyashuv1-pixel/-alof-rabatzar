<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>אלוף הוראות הרבצ״ר</title>
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=5" data-file="1">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png?v=5" data-file="1">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=5" data-file="1">
<link rel="manifest" href="./manifest.webmanifest?v=5">
<script>window.__SW__=true;</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1a33;--navy2:#07122a;--navy3:#12284f;--line:#22406f;
  --gold:#d4af37;--gold2:#f3d77a;--gold3:#9c7a1c;--white:#f7f8fb;--muted:#a9b6cf;
  --green:#2ecc71;--green-bg:#123d2a;--red:#ff5a4f;--red-bg:#4a1b1f;--yellow:#ffd84d;
  --r:18px;--sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#16346a 0%,var(--navy) 45%,var(--navy2) 100%) fixed;color:var(--white);font-family:Heebo,system-ui,sans-serif;font-size:17px;line-height:1.5;min-height:100%}
button{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:.02em;unicode-bidi:isolate;direction:ltr;white-space:nowrap;font-weight:700}
.gold{color:var(--gold2)}.g{color:var(--green)}.r{color:var(--red)}.muted{color:var(--muted)}
.app{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:rgba(7,18,42,.88);backdrop-filter:blur(10px);border-bottom:1px solid rgba(212,175,55,.25)}
.top-title{flex:1;text-align:center;font-family:"Frank Ruhl Libre",serif;font-weight:900;color:var(--gold2);font-size:19px}
.iconbtn{background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.35);border-radius:12px;min-height:44px;min-width:48px;padding:0 12px;cursor:pointer;font-weight:700}
.iconbtn:focus-visible,.btn:focus-visible,.gcard:focus-visible,.opt:focus-visible,.mcard:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.brand-sm{display:flex;width:48px}
.emblem-img{object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.wrap{max-width:1040px;margin:0 auto;padding:16px 14px 40px}
.card{background:linear-gradient(180deg,rgba(18,40,79,.92),rgba(11,26,51,.92));border:1px solid rgba(212,175,55,.28);border-radius:var(--r);padding:20px;box-shadow:var(--sh);animation:rise .35s ease}
.center{text-align:center}
h1,h2,h3{margin:.2em 0 .5em;font-family:"Frank Ruhl Libre",serif}
h2{color:var(--gold2);font-size:26px}h3{color:var(--gold);font-size:19px;margin-top:1.2em}
.row{display:flex;align-items:center}.gap{gap:10px}.wrapr{flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}.row.center{justify-content:center;margin-top:12px}
.btn{border:0;border-radius:14px;min-height:52px;padding:10px 20px;font-weight:700;cursor:pointer;transition:transform .12s,filter .15s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.6)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));color:#1a1405;box-shadow:0 6px 18px rgba(212,175,55,.3)}
.btn.red{background:linear-gradient(180deg,#ff7b70,#d63a30);color:#fff}
.btn.ghost{background:rgba(255,255,255,.06);border:1.5px solid rgba(212,175,55,.45);color:var(--white)}
.btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
.btn.big{min-height:60px;font-size:19px;padding:12px 28px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:44px}
.hero{text-align:center;padding:14px 0 6px}
.hero h1{font-size:clamp(30px,7vw,46px);font-weight:900;background:linear-gradient(180deg,#fff3c4,var(--gold2) 40%,var(--gold) 70%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;margin:.15em 0 0;letter-spacing:.01em}
.sub{color:var(--muted);margin:.2em 0 14px}
.kpis{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.kpis.wide{justify-content:space-between}
.kpi{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.25);border-radius:16px;padding:12px 18px;min-width:130px;display:flex;flex-direction:column;align-items:center;gap:4px}
.kpi>b{font-size:30px;color:var(--gold2);line-height:1.1}.kpi span{color:var(--muted);font-size:14px}
.ring{--p:0;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--navy2);display:grid;place-items:center;font-size:17px;color:var(--gold2)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0;padding:14px 16px;border-radius:16px;background:rgba(212,175,55,.12);border:1.5px solid var(--gold)}
.banner.resume{background:rgba(46,204,113,.1);border-color:var(--green)}
.banner.warnb{background:rgba(255,216,77,.08);border-color:var(--yellow);color:#fff3c4;display:block}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 16px;min-height:170px;border-radius:22px;cursor:pointer;
  background:linear-gradient(160deg,#18386f,#0d2149 60%,#0a1937);border:1.5px solid rgba(212,175,55,.5);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .2s,box-shadow .2s}
.gcard:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 2px rgba(212,175,55,.35)}
.gcard:disabled{opacity:.55;cursor:not-allowed}
.gicon{font-size:42px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.gtitle{font-family:"Frank Ruhl Libre",serif;font-size:24px;font-weight:900;color:var(--gold2)}
.gdesc{color:var(--muted);font-size:15px}
.glock{position:absolute;top:10px;left:12px;font-size:13px;color:var(--muted)}
.btn.exam{width:100%;margin-top:14px;min-height:66px;font-size:21px;background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--gold3));color:#1a1405;box-shadow:0 8px 24px rgba(212,175,55,.3)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.btn.tile{flex-direction:column;background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.3);min-height:86px;font-size:26px;gap:2px}
.btn.tile span{font-size:15px}
.fine{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
.setup{max-width:620px;margin:0 auto}.setup-h{display:flex;align-items:center;gap:12px}
.lbl{display:block;color:var(--gold);font-weight:700;margin:14px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px}
.seg button{flex:1;min-height:48px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-weight:700;padding:6px 10px;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405}
.records{display:grid;gap:6px;margin:16px 0}.records>div{display:flex;justify-content:space-between;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.05)}
.records span{color:var(--muted)}.records b{color:var(--gold2)}
.setup .btn.big{width:100%}
.warn,.hint-line{color:var(--yellow);font-size:15px}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hud>div{flex:1;min-width:84px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:6px 10px;text-align:center}
.hud span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hud b{font-size:20px;color:var(--gold2)}
.hud .danger b{color:var(--red);animation:pulse .6s infinite alternate}
.progress,.timerbar{height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-bottom:8px}
.progress i,.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));transition:width .4s}
.timerbar i{background:var(--green);transition:width 1s linear}.timerbar i.low{background:var(--red)}
/* זיכרון */
.mgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));perspective:1000px}
@media(min-width:700px){.mgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
.mcard{background:none;border:0;padding:0;cursor:pointer;min-height:118px;aspect-ratio:4/5}
.mcard .inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.mcard.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:8px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.face.back{background:repeating-linear-gradient(45deg,#0f2752 0 10px,#0c2045 10px 20px);border:2px solid var(--gold)}
.face.front{transform:rotateY(180deg);background:linear-gradient(180deg,#fdfbf3,#efe6c7);color:#0b1a33;border:2px solid var(--gold);text-align:center}
.face.front.num{background:linear-gradient(180deg,#1b3a73,#0d2149);color:var(--gold2);font-size:clamp(17px,4.4vw,22px)}
.mname{font-weight:700;font-size:clamp(12px,3.2vw,15px);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.mcard.matched .face.front{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,204,113,.45)}
.mcard.matched{opacity:.8}
.mcard.flash .face.front{animation:glow .9s}
.mcard.flash{animation:pop .6s}
.mcard.miss .face.front{border-color:var(--red)}
.mcard.miss{animation:shake .4s .45s}
/* שאלות */
.qcard{background:linear-gradient(180deg,rgba(18,40,79,.95),rgba(11,26,51,.95));border:1.5px solid rgba(212,175,55,.4);border-radius:22px;padding:20px 16px;text-align:center;box-shadow:var(--sh);animation:rise .3s ease;transition:border-color .3s,box-shadow .3s}
.qcard.ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,204,113,.25),var(--sh)}
.qcard.no{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,90,79,.22),var(--sh)}
.qtype{display:inline-block;font-size:13px;color:var(--gold);border:1px solid rgba(212,175,55,.45);border-radius:20px;padding:2px 12px;margin-bottom:8px}
.qask{color:var(--muted)}
.qname{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(22px,5.4vw,32px);line-height:1.3;margin:6px 0 14px;color:#fff}
.qbig{font-size:clamp(36px,10vw,56px);color:var(--gold2);margin:4px 0 14px}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{min-height:60px;border-radius:14px;border:1.5px solid rgba(212,175,55,.45);background:rgba(255,255,255,.05);cursor:pointer;padding:10px 14px;font-weight:600;font-size:17px;line-height:1.35;transition:transform .12s,background .2s}
.opt.numopt{font-size:22px}
.opt:not(:disabled):hover{background:rgba(212,175,55,.14)}.opt:active{transform:scale(.98)}
.opt.right{background:var(--green-bg);border-color:var(--green);color:#d9ffe9;animation:pop .45s}
.opt.wrong{background:var(--red-bg);border-color:var(--red);color:#ffe0dd;animation:shake .4s}
.opt.dim{opacity:.45}.opt.gone{opacity:.15;text-decoration:line-through}
.fb{margin-top:14px;padding:12px;border-radius:14px;animation:rise .25s}
.fb.good{background:var(--green-bg);color:#d9ffe9}.fb.bad{background:var(--red-bg);color:#ffe0dd}
.fb b{font-size:20px}.fb .answer{margin-top:6px;font-size:17px}.fb .yours{font-size:14px;opacity:.85}
.crack{display:flex;flex-direction:column;align-items:center;gap:10px}
.lock{width:70px;height:70px;color:var(--gold)}
.lock .shackle{transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.lock.open{color:var(--green)}.lock.open .shackle{transform:translate(0,-9px) rotate(-28deg);transform-origin:44px 30px}
.lock.shake{color:var(--red);animation:shake .45s}
.slots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;direction:ltr}
.slot{min-width:34px;height:52px;display:grid;place-items:center;font-size:28px;font-weight:800;border-radius:10px;font-variant-numeric:tabular-nums}
.slot.fixed{color:var(--gold2);min-width:22px}
.slot.blank{background:rgba(255,255,255,.08);border:2px dashed rgba(212,175,55,.6);color:#fff;min-width:38px}
.slot.cur{border-style:solid;border-color:var(--gold2);animation:blink 1s infinite}
.slot.good{border-color:var(--green);color:var(--green)}.slot.bad{border-color:var(--red);color:var(--red)}
.typebox{width:min(100%,340px);text-align:center;font-size:32px;font-weight:800;letter-spacing:.06em;padding:10px;border-radius:14px;border:2px solid var(--gold);background:rgba(0,0,0,.3);color:#fff;font-family:inherit;caret-color:transparent}
.typebox::placeholder{color:rgba(255,255,255,.25)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px;margin:14px auto 0}
.keypad button{min-height:58px;border-radius:14px;border:1px solid rgba(212,175,55,.35);background:linear-gradient(180deg,#1a3870,#0f2550);font-size:26px;font-weight:800;cursor:pointer;color:#fff;touch-action:manipulation}
.keypad button:active{transform:scale(.95);background:#24498a}
.keypad .bk{color:var(--gold2)}
.runner .btn.big{min-width:220px}
.runner .row.gap{margin-top:14px}
/* סיכום */
.summary .trophy{font-size:62px;animation:pop .7s}
.grade{font-size:64px;font-weight:900;color:var(--gold2);line-height:1}.grade small{font-size:22px;color:var(--muted)}
.badge-rec{display:inline-block;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;font-weight:800;padding:4px 14px;border-radius:20px;margin-bottom:8px;animation:pop .6s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats3>div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px;text-align:center}
.stats3 b{display:block;font-size:26px}.stats3 .g b{color:var(--green)}.stats3 .r b{color:var(--red)}.stats3 span{color:var(--muted);font-size:14px}
.wlist{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:6px}
.wlist li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 12px;border-radius:12px;background:rgba(255,90,79,.08);border-right:4px solid var(--red)}
.wlist .wy{grid-column:1/-1;font-size:13px;color:var(--muted)}
/* טבלאות */
.dbbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.search,.field{width:100%;min-height:50px;border-radius:12px;border:1.5px solid rgba(212,175,55,.4);background:rgba(0,0,0,.25);color:#fff;padding:10px 14px;font-family:inherit;font-size:17px}
.search{flex:1;min-width:200px}
.ta{min-height:110px;resize:vertical;margin:6px 0}.mono{font-family:ui-monospace,monospace;font-size:13px}
.num-in{text-align:left;font-weight:700;letter-spacing:.04em}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;margin-top:6px}.chk input{width:22px;height:22px;accent-color:var(--gold)}
.tbl{margin-top:12px;border:1px solid rgba(212,175,55,.25);border-radius:14px;overflow:hidden}
.tr{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid rgba(255,255,255,.06)}
.tr:nth-child(even){background:rgba(255,255,255,.025)}
.tr.th{background:rgba(212,175,55,.14)!important;color:var(--gold2);font-weight:800;border-top:0}
.tr.rev{background:rgba(255,216,77,.09)!important;box-shadow:inset -4px 0 0 var(--yellow)}
.tbl.stats .tr{grid-template-columns:96px minmax(120px,1fr) 34px 34px 50px 40px 70px;font-size:15px}
.tbl.stats .nm{font-size:14px}.tbl.stats .dt{font-size:12px;color:var(--muted)}
@media(max-width:620px){.tbl.stats .tr{grid-template-columns:86px 1fr 30px 30px 46px}.tbl.stats .tr>span:nth-child(6),.tbl.stats .tr>span:nth-child(7){display:none}}
.acts{display:flex;gap:6px}
.mini{min-width:44px;min-height:44px;border-radius:10px;border:1px solid rgba(212,175,55,.35);background:rgba(255,255,255,.05);cursor:pointer;font-size:17px}
.mini.g{color:var(--green);border-color:var(--green)}.mini.r{border-color:rgba(255,90,79,.5)}
.tag{font-style:normal;font-size:12px;border-radius:10px;padding:1px 8px;margin-inline-start:6px;font-weight:700}
.tag.y{background:var(--yellow);color:#2a2000}.tag.r{background:var(--red);color:#fff}
.note{display:block;color:#fff3c4;font-size:13px}
.pill{border-radius:20px;padding:4px 14px;font-weight:800;font-size:14px}.pill.g{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}.pill.y{background:rgba(255,216,77,.12);color:var(--yellow);border:1px solid var(--yellow)}
.approve{margin-top:16px}
.empty{padding:20px;text-align:center;color:var(--muted)}.empty.big{font-size:18px;padding:40px 10px}
.exams{display:grid;gap:6px}.exrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:10px 14px;background:rgba(255,255,255,.05);border-radius:12px;align-items:center}
.exrow b{font-size:22px;text-align:center}.exrow span:last-child{text-align:left;color:var(--muted)}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.iconrow{align-items:center}
/* חלונות */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(3,8,20,.72);display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#143061,#0b1a33);border:1.5px solid var(--gold);border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .25s}
.modal-body{margin-bottom:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:60;background:#fff;color:var(--navy);font-weight:700;padding:12px 22px;border-radius:30px;box-shadow:var(--sh);animation:rise .25s;max-width:92vw;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes blink{50%{box-shadow:0 0 0 3px rgba(243,215,122,.35)}}
@keyframes pulse{to{opacity:.55}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(46,204,113,.9)}100%{box-shadow:0 0 0 14px rgba(46,204,113,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* משחקים 4–5 */
.small{font-size:14px}
.lmeter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.lm{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 4px;text-align:center;border-top:3px solid var(--muted)}
.lm b{display:block;font-size:22px}.lm span{font-size:12.5px;color:var(--muted);line-height:1.2;display:block}
.lm.learning,.lm.a-practice{border-color:var(--gold)}.lm.retrieved,.lm.a-mastered{border-color:var(--green)}.lm.review,.lm.a-hard{border-color:var(--red)}
.lm.retrieved b,.lm.a-mastered b{color:var(--green)}.lm.review b,.lm.a-hard b{color:var(--red)}.lm.learning b,.lm.a-practice b{color:var(--gold2)}
.ladderbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.rung{display:flex;flex-direction:column-reverse;gap:3px;padding:4px;border-radius:8px;background:rgba(255,255,255,.05)}
.rung i{width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.rung i.on{background:var(--gold)}.rung i.cur{background:var(--gold2);animation:blink 1s infinite}
.rung.s5 i{background:var(--green)}
.intro{display:flex;flex-direction:column;align-items:center;gap:6px}
.introbig{font-size:clamp(44px,13vw,72px);color:var(--gold2);line-height:1.1;text-shadow:0 4px 18px rgba(212,175,55,.35);animation:pop .6s}
.nameform{width:100%;display:flex;justify-content:center}
.namebox{width:min(100%,520px);font-size:21px;font-weight:700;text-align:center;padding:14px;border-radius:14px;border:2px solid var(--gold);background:rgba(0,0,0,.3);color:#fff;font-family:inherit}
.namebox:focus{outline:3px solid var(--gold2);outline-offset:2px}
.mastery{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:14px;color:var(--muted)}
.mbar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--green));transition:width .5s}
.mastery b{color:var(--gold2)}
.hud .hot b{color:#ffb347}
@media(max-width:380px){.lm span{font-size:11px}}

/* ===== ספריית הפקודות ===== */
.btn.libbtn{width:100%;margin-top:14px;min-height:70px;flex-wrap:wrap;font-size:21px;background:linear-gradient(180deg,#fdfbf3,#efe6c7);color:#0b1a33;border:2px solid var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.btn.libbtn small{flex-basis:100%;font-size:14px;font-weight:500;color:#3b4a66}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.lib{--scale:1;font-family:Heebo,Assistant,"Segoe UI",Arial,sans-serif;font-size:calc(17px * var(--scale));line-height:1.55;color:var(--l-text);background:var(--l-bg);
  box-shadow:0 0 0 100vmax var(--l-bg);clip-path:inset(-16px -100vmax -100vmax);margin:-16px 0 0;padding:1em 0 2.5em;min-height:calc(100vh - 62px)}
.lib.theme-light{--l-bg:#f4f2ec;--l-surface:#ffffff;--l-text:#14213d;--l-muted:#4b5563;--l-border:#d6d0c0;--l-navy:#0c2148;--l-navy2:#16336b;--l-gold:#7d5a0c;--l-gold-bg:#fbf1d4;--l-btn:#ffffff;--l-focus:#1d4ed8;--l-shadow:0 2px 12px rgba(12,33,72,.08),0 1px 2px rgba(12,33,72,.06);--l-good:#166534;--l-good-bg:#e7f6ec;--l-bad:#9f1d1d;--l-bad-bg:#fdecec;--l-mid:#7a4d00;--l-mid-bg:#fff4dc}
.lib.theme-dark{--l-bg:#0a1730;--l-surface:#12284f;--l-text:#f3f5fa;--l-muted:#c3cde0;--l-border:#2c4a7d;--l-navy:#050e24;--l-navy2:#0d2045;--l-gold:#f3d77a;--l-gold-bg:#3a2f10;--l-btn:#17305e;--l-focus:#9cc2ff;--l-shadow:0 4px 18px rgba(0,0,0,.35);--l-good:#7ee2a4;--l-good-bg:#123d2a;--l-bad:#ffb4ad;--l-bad-bg:#4a1b1f;--l-mid:#ffd27a;--l-mid-bg:#3d2e0d}
.lib *:focus-visible{outline:3px solid var(--l-focus)!important;outline-offset:2px}
.lib h1,.lib h2,.lib h3{font-family:inherit;color:inherit;margin:0}
.ltitle{font-size:1.9em;font-weight:900;color:var(--l-navy);margin:.3em 0 .1em!important;letter-spacing:-.01em}
.theme-dark .ltitle{color:var(--l-gold)}
.ltitle.sm{font-size:1.2em;margin:0!important}
.lsub{color:var(--l-muted);margin:.2em 0 1em}
.lsmall{font-size:.88em;color:var(--l-muted)}
.center{text-align:center}
.lbar{display:flex;flex-wrap:wrap;align-items:center;gap:.4em;padding-bottom:.6em;border-bottom:1px solid var(--l-border)}
.lspacer{flex:1}
.lscale{min-width:3.2em;text-align:center;font-weight:700}
.lrow{display:flex;align-items:center}.lrow.wrap{flex-wrap:wrap}.lrow.gap{gap:.5em}.lrow.between{justify-content:space-between}.lrow.center{justify-content:center}
.lbtn{min-height:44px;min-width:44px;padding:.4em .95em;border-radius:.75em;border:1.5px solid var(--l-border);background:var(--l-btn);color:var(--l-text);font-family:inherit;font-weight:700;font-size:.92em;line-height:1.25;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:.35em;text-align:center}
.lbtn:hover:not(:disabled){border-color:var(--l-navy2)}
.lbtn:active:not(:disabled){transform:scale(.97)}
.lbtn:disabled{opacity:.45;cursor:not-allowed}
.lbtn.ghost{background:transparent}
.lbtn.primary{background:var(--l-navy);border-color:var(--l-navy);color:#fff}
.theme-dark .lbtn.primary{background:var(--l-gold);border-color:var(--l-gold);color:#14110a}
.lbtn.on{background:var(--l-gold-bg);border-color:var(--l-gold);color:var(--l-gold)}
.lbtn.wide{width:100%;min-height:54px;font-size:1.05em;margin-top:.6em}
.lactions-main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11em),1fr));gap:.7em;margin:.4em 0 1.1em}
.lbig{min-height:4.6em;border-radius:1em;border:0;background:linear-gradient(160deg,var(--l-navy2),var(--l-navy));color:#fff;font-family:inherit;font-size:1.02em;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;padding:.6em;box-shadow:var(--l-shadow);transition:transform .15s}
.lbig span{font-size:1.5em}.lbig small{font-weight:600;opacity:.9}
.lbig:hover{transform:translateY(-2px)}
.lsearch{display:flex;gap:.4em;align-items:center;margin:.4em 0 .6em}
.lsearch input{flex:1;min-width:0;width:100%;min-height:3.1em;font-size:1.05em;font-family:inherit;padding:.5em .9em;border-radius:.9em;border:2px solid var(--l-border);background:var(--l-surface);color:var(--l-text)}
.lsearch input::placeholder{color:var(--l-muted);opacity:1}
.lcount{margin:.2em 0;color:var(--l-muted);font-weight:600}
.lgrid{list-style:none;padding:0;margin:1em 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19em),1fr));gap:1em}
.lcard{background:var(--l-surface);border:1px solid var(--l-border);border-radius:1.1em;padding:1.1em 1.1em 1em;box-shadow:var(--l-shadow);display:flex;flex-direction:column;gap:.75em;height:100%;animation:lfade .3s ease both}
.lcard.is-hard{border-inline-start:5px solid var(--l-gold)}
.lcard.is-done{opacity:.8}
.lcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.6em}
.lname{font-size:1.22em;font-weight:800;line-height:1.35;color:var(--l-text);overflow-wrap:anywhere}
.lname.big{font-size:1.55em;display:block;text-align:center}
.lstatus{flex-shrink:0;font-size:.78em;font-weight:700;padding:.15em .6em;border-radius:1em;border:1px solid var(--l-border);color:var(--l-muted);white-space:nowrap}
.lstatus.s-hard{color:var(--l-bad);border-color:var(--l-bad)}.lstatus.s-known{color:var(--l-good);border-color:var(--l-good)}.lstatus.s-refresh{color:var(--l-mid);border-color:var(--l-mid)}
.lnum{text-align:center;padding:.35em 0;border-radius:.8em;background:var(--l-gold-bg)}
.lnum-val,.lnum-masked{display:inline-block;font-size:min(2.15em,12.5vw);max-width:100%;font-weight:900;letter-spacing:.05em;color:var(--l-gold);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.lnum-masked{color:var(--l-muted);letter-spacing:.12em}
.lnum.big .lnum-val,.lnum.big .lnum-masked{font-size:min(3.2em,14vw)}
@media(min-width:700px){.lnum-val,.lnum-masked{font-size:min(2.15em,5.5vw)}.lnum.big .lnum-val,.lnum.big .lnum-masked{font-size:min(3.2em,8vw)}}
.lnum mark,.lname mark{background:#ffe27a;color:#1a1405;border-radius:.2em;padding:0 .08em;box-shadow:0 0 0 2px #b8860b inset}
.lcard-actions{display:flex;flex-wrap:wrap;gap:.45em;margin-top:auto}
.lcard-actions .lbtn{flex:1 1 auto}
.lpanel{background:var(--l-surface);border:1px solid var(--l-border);border-radius:1.1em;padding:1.1em;box-shadow:var(--l-shadow);margin:.8em 0;display:flex;flex-direction:column;gap:.7em}
.lpanel.resume{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;border-color:var(--l-gold)}
.lpanel h2{font-size:1.25em;font-weight:800}
.lfield{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:.35em}
.lfield legend,.lfield>span{font-weight:700;margin-bottom:.3em;padding:0}
.lfield.inline{flex-direction:row;align-items:center;gap:.5em}
.lfield select{min-height:48px;font-size:1em;font-family:inherit;padding:.4em .6em;border-radius:.7em;border:1.5px solid var(--l-border);background:var(--l-surface);color:var(--l-text)}
.lseg{display:flex;flex-wrap:wrap;gap:.4em}
.lseg button{flex:1 1 auto;min-height:46px;padding:.4em .8em;border-radius:.7em;border:1.5px solid var(--l-border);background:var(--l-btn);color:var(--l-text);font-family:inherit;font-weight:700;font-size:.92em;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lseg button small{font-weight:500;font-size:.82em;opacity:.85}
.lseg button[aria-pressed="true"]{background:var(--l-navy);border-color:var(--l-navy);color:#fff}
.lseg button[aria-pressed="true"]::before{content:"✓ "}
.theme-dark .lseg button[aria-pressed="true"]{background:var(--l-gold);border-color:var(--l-gold);color:#14110a}
.lseg button:disabled{opacity:.45}
.lnotice{margin:.5em 0;padding:.75em 1em;border-radius:.8em;border:1.5px solid var(--l-mid);background:var(--l-mid-bg);color:var(--l-text)}
.lnotice.ok{border-color:var(--l-good);background:var(--l-good-bg)}
.lempty{text-align:center;color:var(--l-muted);padding:2em 1em;font-size:1.05em}
.lprog{height:.55em;border-radius:1em;background:var(--l-border);overflow:hidden;margin:.6em 0}
.lprog i{display:block;height:100%;background:linear-gradient(90deg,var(--l-navy2),var(--l-gold));transition:width .4s}
.lreasons{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.35em}
.lreasons li{font-size:.8em;padding:.15em .6em;border-radius:1em;background:var(--l-gold-bg);color:var(--l-text);border:1px solid var(--l-border)}
.lnav{margin:.8em 0 .3em;gap:.5em}
.lstats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.lstats>div{border-radius:.9em;padding:.7em .4em;border:1.5px solid var(--l-border)}
.lstats b{display:block;font-size:1.8em}
.lstats .s-good{border-color:var(--l-good);background:var(--l-good-bg)}.lstats .s-mid{border-color:var(--l-mid);background:var(--l-mid-bg)}.lstats .s-bad{border-color:var(--l-bad);background:var(--l-bad-bg)}
/* כרטיסיות מתהפכות */
.fc-wrap{perspective:1400px;margin:.6em 0}
.fc{display:block;width:100%;min-height:16em;border:0;padding:0;background:none;cursor:pointer;font-family:inherit;color:inherit;border-radius:1.4em}
.fc-inner{position:relative;display:block;width:100%;min-height:16em;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.2,.4,1)}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;padding:1.2em;border-radius:1.4em;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--l-shadow)}
.fc-front{background:linear-gradient(160deg,var(--l-navy2),var(--l-navy));color:#fff}
.fc-front .lname{color:#fff}.fc-front .lnum-val{color:#f3d77a}.fc-front .lnum{background:transparent}
.fc-back{background:var(--l-surface);border:2px solid var(--l-gold);transform:rotateY(180deg)}
.fc-label{font-size:.95em;opacity:.9}
.fc-hint{font-size:.85em;opacity:.85;margin-top:.4em}
.lib.reduce .fc-inner,.lib.reduce .lcard,.lib.reduce .lbig,.lib.reduce .lbtn{transition:none!important;animation:none!important}
.lib.reduce .fc.flipped .fc-inner{transform:none}
.lib.reduce .fc-face{backface-visibility:visible;transform:none}
.lib.reduce .fc .fc-back{display:none}.lib.reduce .fc.flipped .fc-back{display:flex}.lib.reduce .fc.flipped .fc-front{display:none}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;margin:.4em 0}
.grades .lbtn{min-height:3.4em;font-size:1em;flex-direction:column;gap:.1em}
.g-bad{border-color:var(--l-bad)!important;background:var(--l-bad-bg)!important;color:var(--l-bad)!important}
.g-mid{border-color:var(--l-mid)!important;background:var(--l-mid-bg)!important;color:var(--l-mid)!important}
.g-good{border-color:var(--l-good)!important;background:var(--l-good-bg)!important;color:var(--l-good)!important}
kbd{font-family:inherit;font-size:.75em;border:1px solid currentColor;border-radius:.3em;padding:0 .35em;opacity:.75}
@media(max-width:420px){.grades{grid-template-columns:1fr}}
.lmodal-bg{position:fixed;inset:0;z-index:70;background:rgba(5,12,30,.6);display:grid;place-items:center;padding:1em;overflow:auto}
.lmodal{width:min(40em,100%);max-height:94vh;overflow:auto;background:var(--l-surface);color:var(--l-text);border-radius:1.3em;padding:1.2em;border:2px solid var(--l-gold);box-shadow:0 20px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:.9em;animation:lfade .2s}
/* שמע */
.lh3{font-size:1.08em;font-weight:800;margin-top:.4em!important}
.lfield-label{font-weight:700}
.lfield select{flex:1;min-width:0}
.ldiag{display:flex;flex-wrap:wrap;gap:.4em 1.2em;margin:0}
.ldiag div{display:flex;gap:.35em}.ldiag dt{font-weight:700}.ldiag dd{margin:0}
.lfiles-help{margin:0;padding-inline-start:1.2em;display:grid;gap:.15em}
.lfile{position:relative;overflow:hidden}.lfile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.lnotice p{margin:.2em 0}
@keyframes lfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lib *{transition:none!important;animation:none!important}}

/* מסכים מתקפלים / רחבים */
@media(min-width:900px){.runner{max-width:760px;margin:0 auto}}
@media(max-width:380px){body{font-size:16px}.kpi{min-width:110px}.mgrid{grid-template-columns:repeat(3,1fr);gap:7px}}
